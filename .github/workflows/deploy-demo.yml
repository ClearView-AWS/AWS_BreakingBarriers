# Redeploy the CloudFront + Fargate demo whenever main changes.
# Signs in with GitHub OIDC: repo variable AWS_DEPLOY_ROLE_ARN names an IAM role
# (GsGitHubDeploy) that trusts this repo's main branch. No stored AWS keys.
# Optional secret:
#   OPENSEARCH_ENDPOINT — existing domain hostname (no https://). Without it the
#   app keeps the local in-memory search engine.
#   VOICE_INSTANCE_ID, VOICE_FLOW_ID, VOICE_SOURCE, VOICE_VERIFIED_TO — Amazon Connect
#   ids from scripts/setup_voice.py and the one number school calls may reach. Without
#   all four the "Have AI call" button emails the school instead.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: CloudFront + Fargate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: us-east-1
      CDK_DEFAULT_REGION: us-east-1
      BEDROCK: "1"
      SKIP_OPENSEARCH: "1"
      OPENSEARCH_ENDPOINT: ${{ secrets.OPENSEARCH_ENDPOINT }}
      VOICE_INSTANCE_ID: ${{ secrets.VOICE_INSTANCE_ID }}
      VOICE_FLOW_ID: ${{ secrets.VOICE_FLOW_ID }}
      VOICE_SOURCE: ${{ secrets.VOICE_SOURCE }}
      VOICE_VERIFIED_TO: ${{ secrets.VOICE_VERIFIED_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set CDK account
        run: echo "CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install infra deps
        working-directory: infra
        run: npm ci

      - name: Deploy demo stack
        run: ./scripts/deploy-demo.sh
