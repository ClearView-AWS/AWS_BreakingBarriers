# Redeploy the CloudFront + Fargate demo whenever main changes.
# Needs repo secrets (Workshop Studio sessions expire — refresh when login renews):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (if temporary)
# Optional:
#   OPENSEARCH_ENDPOINT — existing domain hostname (no https://). Without it the
#   app keeps the local in-memory search engine.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: CloudFront + Fargate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: us-east-1
      CDK_DEFAULT_REGION: us-east-1
      BEDROCK: "1"
      SKIP_OPENSEARCH: "1"
      OPENSEARCH_ENDPOINT: ${{ secrets.OPENSEARCH_ENDPOINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Set CDK account
        run: echo "CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install infra deps
        working-directory: infra
        run: npm ci

      - name: Deploy demo stack
        run: ./scripts/deploy-demo.sh
