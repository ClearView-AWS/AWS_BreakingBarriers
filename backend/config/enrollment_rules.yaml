# How admission works, by state and admission type.
# Each rule explains and keeps its official link beside it. Like funding_rules.yaml,
# it never promises a seat or estimates a family's chances.
#
# FL wording follows the 2025 Florida Statutes (checked 2026-11-03).
# WA wording follows OSPI / OEO enrollment pages (checked 2026-11-04).
checked: "2026-11-04"

# Florida rules (synthetic Jacksonville / Miami / Orlando corpus).
rules:
  zoned:
    label: Zoned school
    summary: >
      Every home address in a Florida district is assigned a neighborhood public
      school. A child who lives in the school's attendance zone can enroll there.
    next_step: Check which school your address is zoned for.
    official_name: Florida school choice options (Florida Department of Education)
    official_url: https://www.fldoe.org/schools/school-choice/
    agency: Florida Department of Education
    cite_path: enrollment.zoned

  choice:
    label: School choice
    summary: >
      Florida's controlled open enrollment lets a parent enroll a child in any
      public school, including a charter school, that has not reached capacity.
      Districts also run magnet and choice programs with an application window,
      and use a lottery when there are more applicants than seats.
    next_step: Apply through the district's school choice application.
    official_name: Florida Statutes 1002.31, controlled open enrollment
    official_url: https://www.flsenate.gov/Laws/Statutes/2025/1002.31
    more_url: https://www.fldoe.org/schools/school-choice/other-school-choice-options/controlled-open-enrollment.stml
    agency: Florida Department of Education
    cite_path: enrollment.choice

  lottery:
    label: Lottery
    summary: >
      A Florida charter school must enroll every eligible student who applies on
      time, unless applications exceed its capacity. Then every applicant has an
      equal chance through a random selection. District magnet programs also use
      a lottery when they have more applicants than seats.
    next_step: Apply by the deadline; if there are more applicants than seats, a lottery decides.
    official_name: Florida Statutes 1002.33(10), charter school admission
    official_url: https://www.flsenate.gov/Laws/Statutes/2025/1002.33
    agency: Florida Department of Education
    cite_path: enrollment.lottery

  application:
    label: Application
    summary: >
      Each private school sets its own admission process and deadlines. The
      Florida Department of Education does not oversee private school admission,
      so families apply to the school directly.
    next_step: Apply to the school directly and ask about its deadline.
    official_name: Choosing a private school (Florida Department of Education)
    official_url: https://www.fldoe.org/schools/school-choice/private-schools/choosing-a-private-school.stml
    agency: Florida Department of Education
    cite_path: enrollment.application

# Washington OSPI Report Card corpus (Seattle, Tacoma, Spokane, …).
by_state:
  WA:
    checked: "2026-11-04"
    rules:
      zoned:
        label: Zoned school
        summary: >
          In Washington, a student’s resident school district is based on where
          they live. Districts usually assign a neighborhood (attendance-area)
          school; check your district’s enrollment page for the current map.
        next_step: Check your district’s school assignment or enrollment services page.
        official_name: School enrollment (WA Office of the Education Ombuds)
        official_url: https://www.oeo.wa.gov/en/education-issues/school-enrollment
        more_url: https://ospi.k12.wa.us/student-success/support-programs/student-transfers
        agency: Washington OSPI
        cite_path: enrollment.zoned

      choice:
        label: School choice
        summary: >
          Washington families can request a choice (nonresident) transfer to attend
          a public school outside their resident district. Both the resident and
          nonresident districts must approve. Many districts also run open enrollment
          within the district.
        next_step: Ask your district about open enrollment, or start a choice transfer.
        official_name: Student transfers (Washington OSPI)
        official_url: https://ospi.k12.wa.us/student-success/support-programs/student-transfers
        more_url: https://eds.ospi.k12.wa.us/ChoiceTransferRequest/
        agency: Washington OSPI
        cite_path: enrollment.choice

      lottery:
        label: Lottery
        summary: >
          Some Washington charter and choice programs admit by application and use
          a lottery when there are more applicants than seats. District policies
          set the window and how seats are filled.
        next_step: Apply by the program deadline; a lottery may decide if seats are limited.
        official_name: School choice / transfers (WA Office of the Education Ombuds)
        official_url: https://www.oeo.wa.gov/en/education-issues/school-choice-transfers
        more_url: https://ospi.k12.wa.us/student-success/support-programs/student-transfers
        agency: Washington OSPI
        cite_path: enrollment.lottery

      application:
        label: Application
        summary: >
          Private schools in Washington set their own admission process and
          deadlines. Families apply to the school directly.
        next_step: Apply to the school directly and ask about its deadline.
        official_name: School enrollment (WA Office of the Education Ombuds)
        official_url: https://www.oeo.wa.gov/en/education-issues/school-enrollment
        agency: Washington OSPI
        cite_path: enrollment.application

# District pages for each demo metro. locator_url opens the district's official
# "find my zoned school" tool; null means none was found, so the card hides that button.
districts:
  Seattle:
    name: Seattle Public Schools
    locator_url: https://www.seattleschools.org/departments/enrollment-services/assignment/
    choice_url: https://www.seattleschools.org/departments/enrollment-services/
    window: >
      Seattle Public Schools posts annual open-enrollment and school-choice
      windows on the Enrollment Services site. Check the current school year
      calendar for dates; this demo does not promise seats or odds.
    window_url: https://www.seattleschools.org/departments/enrollment-services/
  Tacoma:
    name: Tacoma Public Schools
    locator_url: https://www.tacomaschools.org/
    choice_url: null
    window: null
    window_url: null
  Spokane:
    name: Spokane Public Schools
    locator_url: https://www.spokaneschools.org/
    choice_url: null
    window: null
    window_url: null
  Jacksonville:
    name: Duval County Public Schools
    locator_url: https://dcps.duvalschools.org/locator
    choice_url: https://www.duvalschools.org/o/dcps/page/magnet-school
    window: >
      For 2026-27, Duval's magnet and school choice lottery took applications from
      Dec 1, 2025 to Jan 31, 2026 through the Family Portal, with results in
