# Hackathon / on-stage demo: never refuse a dial. Every outbound call still goes
# only to DEMO_VOICE_TO (+12065350596) in backend/gaps/phone.py — never a school.
# Set enforce_limits: true only if you want spacing / hours / caps again later.
enforce_limits: false

# Soft cap on how many open questions one call asks (does not block dialing).
max_questions_per_call: 5

# Unused while enforce_limits is false; kept for production-shaped defaults.
min_days_between_calls: 0
global_daily_cap: 1000
business_hours:
  start: "00:00"
  end: "23:59"
  days: [mon, tue, wed, thu, fri, sat, sun]
default_time_zone: America/Los_Angeles
time_zones:
  WA: America/Los_Angeles
  FL: America/New_York
  CA: America/Los_Angeles
  TX: America/Chicago
  NY: America/New_York
do_not_call: []
