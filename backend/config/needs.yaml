# One need per parent phrase. GreatSchools can add a need by editing this file.
# confirmed / partial / fails are operators evaluated in code. Reviews never confirm.
# `label` is also a search phrase. `display` (optional) is the name on chips and cards
# when it should read differently; without it, chips and cards show `label`.
# `max_age_days` (optional, default 365): how long an answer from the school itself
# (call, email reply, staff answer) counts. After that it reads as Partial and is asked again.

high_performing:
  label: High-performing
  default_strength: prefer
  phrases: [top school, best school, best, high rated, high-performing, high performing, a good school, good school, escuela buena, buena escuela, highly rated]
  offer_when_unmapped: false
  evidence:
    - field: summary_rating
      source: state_data
      confirmed: ">= 8"
      partial: "== 7"
      fails: "<= 6"
  search_boost:
    summary_rating: { gte: 8 }
  review_topics: []
  ask_if_unknown: "Ratings are missing for {n} of these schools. Keep them in the list?"
  visit_question: "How did students do on state tests last year?"

stem:
  label: STEM
  display: STEM-focused
  default_strength: require
  phrases: [stem, robotics, coding, science and math, science & math, ciencias, stem program, science focus, robotica, programacion, tecnologia]
  evidence:
    - field: osp.school_sub_type
      source: school_reported
      confirmed: "contains_any:STEM,stem,science"
      fails: "nonempty"
    - field: osp.student_clubs
      source: school_reported
      confirmed: "contains_any:science_club,robotics,coding,math_club,stem_club"
  search_boost:
    osp.school_sub_type: { terms: [STEM, stem] }
  review_topics: ["STEM / Coding"]
  ask_if_unknown: "STEM isn't listed for {n} of these schools. Should I ask them?"
  visit_question: "What science, technology, or math programs run this year?"

after_care:
  label: After-school care
  max_age_days: 180
  default_strength: require
  phrases: [after-school care, after school care, afterschool care, after care, afterschool, cuidado despues de la escuela, cuidado después de la escuela, after-school program, cuidado despues de clases]
  program_fill: true
  program_match: [after school, after-school, homework help, afterschool, extended care]
  evidence:
    - field: osp.after_school_until
      source: school_reported
      confirmed: "time_covers"
      partial: "time_within:30"
      fails: "time_before"
  ambiguities:
    - kind: definition
      default: on_site
      question: "Does after-school care need to be at the school, or is a nearby program fine?"
      options:
        - { id: on_site, label: At the school }
        - { id: nearby_ok, label: A nearby program is fine }
  search_boost:
    osp.after_school_until: { exists: true }
  review_topics: []
  ask_if_unknown: "After-school care is unknown for {n} of these schools. Is it a must-have? I can ask the schools."
  visit_question: "What time does after-school care end, and is it on campus?"

