# Model ids are configuration. The turn runs with the rules engine when Bedrock
# is off, and calls these ids when BEDROCK_ENABLED=1.
region: us-east-1
# Amazon Nova needs no AWS Marketplace subscription, which the hackathon
# account blocks for Claude. Swap back with FAST_MODEL_ID or -c fastModelId.
fast_model: us.amazon.nova-lite-v1:0
strong_model: us.anthropic.claude-sonnet-5-5
embed_model: amazon.titan-embed-text-v2:0
embed_dimension: 256
