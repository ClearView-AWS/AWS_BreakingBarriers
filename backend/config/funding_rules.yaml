# Private-school cost lines for Washington. Wording only: no award amounts, and
# nothing here promises aid. Every line keeps a link to where it came from.
# Checked 2026-11-03.

private_aid:
  name: Tuition and financial aid at Washington private schools
  applies_to: [private]
  wording: Ask the school about financial aid
  card_note: each Washington private school sets its own tuition and financial aid, so ask the school what aid it offers
  eligibility: >
    Washington private schools are approved by the State Board of Education and
    set their own tuition, admission and financial aid. This app did not find a
    Washington state program that pays private school tuition.
  official_url: https://sbe.wa.gov/private-schools
  link_label: Washington State Board of Education
  cite_path: funding.private_aid

federal_tax_credit:
  name: Federal Education Freedom Tax Credit
  applies_to: [private]
  wording: Not available in Washington yet
  eligibility: >
    Starting January 1, 2027, a federal tax credit funds private school
    scholarships through nonprofits in states that opt in. As of October 2026,
    Washington's governor had not decided whether to join.
  official_url: https://www.opb.org/article/2026/10/15/washington-schools-chief-urges-governor-to-reject-federal-tax-credit/
  link_label: News report (OPB, Oct 15, 2026)
  cite_path: funding.federal_tax_credit
