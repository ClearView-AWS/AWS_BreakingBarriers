# Starting questions for the FAQ sidebar. Each answer describes how this
# prototype works and names where that rule lives, so it never states a fact
# about a school. Ask counts start at zero and only grow when a parent taps
# "I have this question too" or asks the same thing.

match_score:
  question: What does the match percentage mean?
  answer: >
    The match score weighs each thing you asked for by how much it matters
    (must have 3, nice to have 1, avoid 2) and by what the evidence shows.
    "Verified" counts the needs that are confirmed or need attention.
  source: How scoring works (evidence/scorer.py)

statuses:
  question: What do Confirmed, Partial, Needs attention and Unknown mean?
  answer: >
    Confirmed means the school's profile or the school itself states it.
    Partial means there is some support, such as parent posts, but the school has not confirmed it.
    Needs attention means the evidence points against what you asked for.
    Unknown means the profile does not say.
  source: Evidence statuses (evidence/engine.py)

unknown_kept:
  question: Why is a school still listed when something is unknown?
  answer: >
    Missing data is not a reason to drop a school. The school stays in the list,
    the unknown item is marked, and you can ask the school or other parents about it.
  source: Evidence statuses (evidence/engine.py)

parents_vs_school:
  question: Do parent posts count as proof?
  answer: >
    No. Parent posts can support a need, but they never confirm it on their own.
    Only the school's profile or an answer from the school marks a need as confirmed.
  source: Parent community rules (docs/community.md)

getting_in:
  question: Can this tell me my chances of getting in?
  answer: >
    No. The Getting in section explains how a school admits students and links to
    the official page. It never estimates odds or promises a seat.
  source: Washington enrollment rules (config/enrollment_rules.yaml)

cost:
  question: Where do the cost and financial aid notes come from?
  answer: >
    Tuition comes from the school's profile. Financial aid notes point to where aid
    may come from and link to the official page. They are not a promised award.
  source: Washington funding rules (config/funding_rules.yaml)

data:
  question: Is this real school data?
  answer: >
    This is a Seattle prototype. It uses a relocated GreatSchools sample and
    synthetic schools made for the demo, so do not use it to choose a real school.
  source: Demo data (data/synthetic/generate.py)
